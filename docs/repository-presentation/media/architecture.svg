<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Clearlink current hosting architecture</title><desc id="desc">Browsers exchange call media directly. Both reach the Node server on the host computer through Cloudflare Tunnel and independently use Cloudflare STUN for address discovery.</desc><style>text{font-family:Arial,sans-serif;text-anchor:middle;fill:#e9eef4}.label{font-size:21px;font-weight:600}.sub{font-size:16px;fill:#aab5c4}.tag{font-size:15px;fill:#7fd3d9}</style><rect width="1100" height="580" rx="18" fill="#0d131c"/><rect x="65" y="55" width="210" height="78" rx="12" fill="#18232f" stroke="#36455a"/><text x="170.0" y="87" class="label">Browser A</text><rect x="825" y="55" width="210" height="78" rx="12" fill="#18232f" stroke="#36455a"/><text x="930.0" y="87" class="label">Browser B</text><path d="M285 94 H815" fill="none" stroke="#5bc4cc" stroke-width="2" /><text x="550" y="77" class="tag">↔ Direct audio &amp; video ↔</text><rect x="300" y="195" width="500" height="188" rx="16" fill="#101923" stroke="#53667c"/><text x="550" y="224" class="tag">CLOUDFLARE</text><rect x="325" y="250" width="210" height="100" rx="12" fill="#18232f" stroke="#36455a"/><text x="430.0" y="282" class="label">Tunnel</text><text x="430.0" y="308" class="sub">Public HTTPS access</text><rect x="565" y="250" width="210" height="100" rx="12" fill="#18232f" stroke="#36455a"/><text x="670.0" y="282" class="label">STUN</text><text x="670.0" y="308" class="sub">Address discovery</text><path d="M190 133 V295 H325" fill="none" stroke="#718296" stroke-width="2" /><path d="M885 133 V171 H430 V250" fill="none" stroke="#718296" stroke-width="2" /><path d="M240 133 V183 H670 V250" fill="none" stroke="#718296" stroke-width="2" stroke-dasharray="5 5" /><path d="M935 133 V299 H775" fill="none" stroke="#718296" stroke-width="2" stroke-dasharray="5 5" /><path d="M430 350 V443" fill="none" stroke="#718296" stroke-width="2" /><text x="327" y="421" class="sub">Tunnel to your computer</text><rect x="300" y="443" width="500" height="90" rx="12" fill="#18232f" stroke="#36455a"/><text x="550.0" y="475" class="label">Node room server</text><text x="550.0" y="501" class="sub">Your computer · app, rooms, signalling &amp; chat</text><text x="550" y="564" class="sub">STUN is separate from the tunnel. Neither Cloudflare service carries call media.</text></svg>